<!-- 环境音：白/粉/棕噪音 + 音乐导入（timer 与 pomodoro 共用） -->
<section class="review-card sound-card">
  <h2 data-i18n="sound.title">{{ t("sound.title", lang) }}</h2>
  <div class="actions">
    <label class="field-group"><span class="field-label" data-i18n="sound.noise">{{ t("sound.noise", lang) }}</span>
      <select id="noiseType">
        <option value="white" data-i18n="sound.white">{{ t("sound.white", lang) }}</option>
        <option value="pink" data-i18n="sound.pink">{{ t("sound.pink", lang) }}</option>
        <option value="brown" data-i18n="sound.brown">{{ t("sound.brown", lang) }}</option>
      </select></label>
    <button class="btn btn-secondary btn-small" type="button" id="noisePlay"
            data-i18n="sound.play"
            data-play-label="{{ t('sound.play', lang) }}"
            data-stop-label="{{ t('sound.stop', lang) }}">{{ t("sound.play", lang) }}</button>
    <label class="field-group"><span class="field-label" data-i18n="sound.volume">{{ t("sound.volume", lang) }}</span>
      <input type="range" id="noiseVol" min="0" max="1" step="0.05" value="0.3"></label>
  </div>
  <div class="actions">
    <label class="btn btn-secondary btn-small import-btn" for="musicFile" data-i18n="sound.import">{{ t("sound.import", lang) }}</label>
    <input type="file" id="musicFile" accept="audio/*" multiple hidden>
    <button class="btn btn-secondary btn-small" type="button" id="musicPrev" data-i18n="sound.prev">{{ t("sound.prev", lang) }}</button>
    <button class="btn btn-secondary btn-small" type="button" id="musicPlay"
            data-i18n="sound.play"
            data-play-label="{{ t('sound.play', lang) }}"
            data-pause-label="{{ t('sound.pause', lang) }}">{{ t("sound.play", lang) }}</button>
    <button class="btn btn-secondary btn-small" type="button" id="musicNext" data-i18n="sound.next">{{ t("sound.next", lang) }}</button>
    <label class="field-group"><span class="field-label" data-i18n="sound.volume">{{ t("sound.volume", lang) }}</span>
      <input type="range" id="musicVol" min="0" max="1" step="0.05" value="0.5"></label>
  </div>
  <ul class="music-list" id="musicList" data-empty="{{ t('sound.no_songs', lang) }}" data-remove="{{ t('sound.remove', lang) }}" data-now="{{ t('sound.now_playing', lang) }}"></ul>
</section>
