<!doctype html>
<html lang="{{ lang or 'zh' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#a8e6cf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}mathgen 数学出题{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/math-icon.svg">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="/">
        <img class="logo-icon" src="/static/math-icon.svg" alt="" width="36" height="36">
        <span class="logo-text">mathgen</span>
      </a>
      <nav class="nav" aria-label="导航">
        <a href="/product" data-i18n="product.title">{{ t("product.title", lang) }}</a>
        {% block nav %}{% endblock %}
      </nav>
      <div class="header-controls">
        <a class="btn btn-secondary btn-small" href="/user" id="userEntry">👤 <span data-i18n="user.title">{{ t("user.title", lang) }}</span></a>
        <button class="pill-toggle" id="langToggle" type="button" aria-label="Language"><span id="langLabel"></span></button>
        <button class="pill-toggle" id="themeToggle" type="button" aria-label="Theme"><span id="themeLabel"></span></button>
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-copy" data-i18n="footer.copyright">{{ t("footer.copyright", lang, year=2026) }}</p>
      <p class="footer-made" data-i18n="footer.made">{{ t("footer.made", lang) }}</p>
    </div>
  </footer>
  {% if ui_json %}<script type="application/json" id="ui-json">{{ ui_json | safe }}</script>{% endif %}
  <script src="/static/lang.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('/static/sw.js').catch(function () {});
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
