[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathgen"
version = "0.1.0"
description = "小学数学练习题生成工具：口算/竖式/应用题，PDF+答案页"
requires-python = ">=3.11"
dependencies = [
    "reportlab>=4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "fonttools[woff2]>=4.50",
    "python-multipart>=0.0.9",
    "brotli>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "playwright>=1.62.0",
    "pypdf>=6.15.0",
]

[project.scripts]
mathgen = "mathgen.cli:main"
mathgen-serve = "mathgen.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mathgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
