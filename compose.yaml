services:
  mathgen:
    build: .
    image: mathgen:latest
    container_name: mathgen
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      KIDSMATH_DB: /data/kidsmath.db
      TZ: Asia/Shanghai
    volumes:
      - mathgen-data:/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  mathgen-data:
